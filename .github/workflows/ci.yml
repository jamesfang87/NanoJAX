name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (meson, GCC ${{ matrix.gcc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [13]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-${{ matrix.gcc }} meson ninja-build

      - name: Configure
        run: |
          CXX=g++-${{ matrix.gcc }} meson setup builddir

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-gcc${{ matrix.gcc }}
          path: builddir/meson-logs/
          retention-days: 7
